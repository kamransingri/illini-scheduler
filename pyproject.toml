[project]
name = "illini-scheduler-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "httpx>=0.27", "lxml>=5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "icalendar>=6"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
filterwarnings = ["error::DeprecationWarning:pipeline.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["pipeline"]
