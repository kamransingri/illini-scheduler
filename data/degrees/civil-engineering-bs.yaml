  section: Civil Engineering Primary and Secondary Fields
  rule: manual
  notes:
  - Students choose a primary and a secondary field of study, of which there are seven traditional areas of study and three
    interdisciplinary programs to choose from. The particular primary and secondary field selections shape the selection of
    science electives, civil engineering core courses and advanced technical electives. The specific choices of courses in
    this category are made through the submission of a Plan of Study, which is subject to approval by the faculty Program
    Review Committee. Instead of choosing separate primary and secondary field options as listed below, students could select
    to pursue the General Civil Engineering Option. The General Civil Engineering Option offers a broader coverage of Civil
    Engineering topical areas. This option can be found below the Secondary Field list.
  id: civil-engineering-primary-and-secondary-15
