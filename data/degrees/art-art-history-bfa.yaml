- name: 1. Africa and the Middle East
  section: Art History
  rule: manual
  notes:
  - 'Students must take at least one course in three of the following areas: 1) Africa and the Middle East; 2) Asia; 3) the
    Americas; 4) Europe; Students must also take at least one course that covers material before 1700 and one course must
    cover material after 1700.'
  - Though students must take a total of 6 courses, some courses may count toward the fulfillment of more than one area and
    period requirement. For instance, a course in 20th century African art could count as a class covering both Africa and
    the Middle East and material after 1700.
