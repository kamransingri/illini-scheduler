- name: Thematic Area Requirements
  section: Major Requirements
  rule: manual
  notes:
  - 'Students choose an approved thematic area and, in consultation with a Global Studies advisor, construct an appropriate
    customized curriculum of a minimum of 18 hours. Students cannot include more than 3 hours of 100-level work and must complete
    a minimum of 9 hours of 300- and 400-level coursework. Courses must be taken from more than one department. Approved thematic
    areas are:'
  - A. Cultures in Contact
  - B. Wealth and Poverty in a Globalized World
  - C. Human Rights
  - D. Governance, Conflict and Resolution
  - E. Knowledge, Communication and Information Systems
  - F. Environment, Sustainability, and Social Responsibility
  - G. Global Health
  - Optional Senior Capstone. Students do an individual research project (GLBL 200, GLBL 494, LAS 494, and, optionally, GLBL
    495) based on their Thematic Area.
  - Minimum Major Hours
  id: thematic-area-requirements-15
