- name: Major Requirements
  section: Major Requirements
  rule: manual
  notes:
  - 'Component 1: Completion of three years of college-level study of Russian or another language of Eastern Europe or Eurasia,
    or equivalent proficiency. This stipulation may be partially satisfied through fulfillment of the LAS two-year language
    requirement if a regionally appropriate language is chosen for that purpose. A third year of study, however, is demanded
    beyond this. If a non-Russian, East European or Eurasian language is selected to meet the LAS requirement, then the three
    years of Russian, East European or Eurasian language study specified here must be taken in addition to those completed
    to satisfy the LAS requirement. Only the hours earned in the third, most advanced year of language study are calculated
    into the degree here, as these represent proficiency beyond that required by all LAS BA degree programs and as the first
    two years of language study are a prerequisite for the third.'
  - 'Component 2: Russian and East European studies core courses, including:'
  courses:
  - REES 200
  - REES 201
  - REES 495
  id: major-requirements-11
- name: Major Requirements
  section: Major Requirements
  rule: manual
  notes:
  - '15 hours: Choose one course from each of three departments other than the department used for component 3 below. The
    courses comprising the remaining hours of component 2 may be from the same discipline as those under component 3; however,
    a course may be counted toward the total for only one component. Language courses that concentrate on the basic skills
    of speaking, listening, reading, and writing cannot be counted as part of this component.'
  - 'Component 3: Courses in a single discipline. Among those disciplines that are most commonly used with this specialization
    are anthropology, economics, geography, history, political science, Russian language and literature, and sociology. Among
    disciplines also used are business administration, comparative literature, education, English, fine arts, French, German,
    journalism, linguistics, mathematics, music, philosophy, psychology, and various natural sciences. Others are permitted.
    Consult your advisor.'
  id: major-requirements-12
