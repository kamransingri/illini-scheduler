- name: Advanced Electives
  section: Advanced Electives
  rule: manual
  notes:
  - Students must take for a letter grade a minimum of two (2) advanced elective courses comprising at least six (6) credit
    hours. These advanced elective courses must be distinct from courses used to satisfy the technical electives. They may
    be chosen from CS 397 Individual Study and the 400-level coursework offered for letter grade in ANY area offered at the
    University of Illinois Urbana-Champaign. It is expected that students will select these additional advanced courses in
    a way that best augments their program of study. Consultation with a faculty mentors is highly encouraged. A maximum of
    six (6) credit hours of CS 397 may be used in the combination of technical electives and advanced electives.
  id: advanced-electives
- name: Free Electives
  section: Free Electives
  rule: manual
  notes:
