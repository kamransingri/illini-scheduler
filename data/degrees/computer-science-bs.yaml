- name: Technical Electives
  section: Technical Electives
  rule: hours
  notes:
  - Students must take a minimum of (6) six additional technical electives with at least eighteen (18) cumulative credit hours
    and chosen from CS 397 and the CS 400-level courses, not including CS 400, CS 401, CS 402, CS 403 or CS 491. CS 500-level
    courses may be used as technical electives, but only with special permission from the CS Academic Office. CS 397 and CS
    499 may be used with a cumulative maximum of six (6) credits from them counting as technical electives. One "CS-like"
    course in another department (e.g., ECE) may also be counted as a CS 400-level course with permission of the CS Academic
    Office. Non-CS tech electives will not be considered in focus areas.
  - The checklist counts the 18 hours; the catalog also asks for at least six courses, and caps CS 397 and CS 499 together
    at 6 hours (each is capped at 6 here).
