- name: Capstone Experience
  section: General Education Requirements
  rule: manual
  notes:
  - A capstone experience (normally in the student’s senior year) involving intensive interdisciplinary research and writing
    on a medieval topic. Any 400-level MDVL course (or medieval-related course not cross-listed with MDVL, with the approval
    of a Medieval Studies faculty advisor) can be designated as a capstone experience with approval of the instructor. For
    the course to qualify as a capstone experience, the student must undertake a substantial research project that supplements
    the standard course requirements, in the form either of an additional project or of a longer and more research-intensive
    version of an existing course project. The project must involve both primary and secondary research using advanced disciplinary
    methodologies and resources.
  - (A student may also petition to satisfy the capstone experience by enrolling in MDVL 500, Seminar in Medieval Studies)
  id: capstone-experience-17
