- name: Research or Discovery Experience
  section: Major Requirements
  rule: manual
  notes:
  - One of the most important skills a student will gain in an Astronomy & Data Science degree will be the ability to present
    astronomical data in meaningful ways. A research or discovery experience is as much as pillar of this degree program as
    both the data science core coursework (Part 1) and the coursework in Astronomy (Part 2).
  - This experience should be developed with an advisor before the end of a student’s sophomore year and result in the creation
    of one or more artifacts documenting the experience. A minimum of 3 credit hours must be specifically designated to the
    preparation and the completion of the experience component.
  - 'Examples of possible experiences may include:'
  - ● A semester study-abroad with at one or more courses focused on discovery while attending the international institution.
  - ● A multi-semester capstone experience within the student’s area of specialization.
  - ● A semester co-op experience outside Champaign-Urbana focused on a subject within the student’s area of specialization.
  - ● A multi-semester undergraduate research experience under the direction of Illinois faculty.
  - ● A summer NSF REU program focused within a student’s area of specialization.
  id: research-or-discovery-experience-19
