  section: Major Requirements
  rule: manual
  notes:
  - 'Major electives: 15 hours of Linguistics courses at the 200- to 400-level, chosen in consultation with the student''s
    advisor'
  - 'Students must fulfill the LAS foreign language requirement, and in addition, complete at least 8 hours in a second foreign
    language. One of these languages must be a non-Western language chosen from the following list or approved in consultation
    with the student''s advisor: American Sign Language, Arabic, Bamana, Basque, Chinese, Hebrew, Hindi/Urdu, Japanese, Korean,
    Lingala, Persian, Quechua, Sanskrit, Swahili, Turkish, Wolof, Zulu. Courses used to complete this requirement may also
    be used to meet the requirement of "Courses in linguistically relevant areas," below.'
  - 'Courses in linguistically relevant areas chosen in consultation with the student''s advisor. There are two ways of meeting
    this requirement:'
  - 'A. The courses may come from any of the following disciplines: any foreign language, anthropology, classics, computer
    science, English, English as an international language, philosophy, psychology, speech and hearing science, communication.'
  - B. Students desiring to specialize in the linguistics of a particular language should complete at least four semesters
    of instruction in that language beyond the elementary level, and a linguistics course or independent study focusing on
    the selected language or its language family.
  id: major-requirements-14
