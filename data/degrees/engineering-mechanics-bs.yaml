- name: Biomechanics
  section: Secondary Field Option Electives
  rule: manual
  notes:
  - Secondary field electives selected from departmentally approved courses for Secondary Field Options. Each secondary field
    generally specifies two required courses and two additional courses from a list of approved elective courses. For each
    of the secondary fields, the required and approved elective courses specified for each are listed below. To add flexibility
    to the program and to accommodate particular interests, the student may fashion an individualized secondary field option.
    The only requirements are that the courses be related to mechanics, form a coherent and cohesive group, include at least
    two engineering courses, and total at least 12 hours of advanced-level coursework that are distinct from required courses
    in the Engineering Mechanics curriculum. This can include 500-level courses, if the student has the adequate preparation,
    for any of the secondary field elective courses. Each student must formally declare their choice of secondary field with
    a Mechanical Science and Engineering Undergraduate Programs Office advisor using a Secondary Field Options form.
