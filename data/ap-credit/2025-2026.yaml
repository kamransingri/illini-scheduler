# AP credit for students entering Illinois in Summer 2025, Fall 2025 or Spring 2026.
# Copied by hand from CITL's 2025 AP credit page. Format and rules: docs/AP-CREDIT.md. Placement messages are word for
# word; a `fix` says where we corrected the page and quotes it.
year: 2025-2026
entering: Summer 2025, Fall 2025 or Spring 2026
source: https://citl.illinois.edu/advanced-placement-ap-credit-2025
read_on: 2026-11-17
notes:
  - Course numbers listed as 1-- or 2-- are elective credit within the stated subject area. Students can apply
    elective credit towards their graduation requirements; ask your academic advisor how it can best be used in your
    program.
  - The credit policies in effect when you first enrolled at Illinois are the ones that apply to you.
exams:
  - id: AFAM
    name: African American Studies
    rows:
      - scores: [3, 4, 5]
        credit: {AFRO 100: 3}

  - id: RESEARCH
    name: Research
    rows:
      - scores: [3, 4, 5]
        credit: {LAS 1--: 3}

  - id: SEMINAR
    name: Seminar
    rows:
      - scores: [3, 4, 5]
        credit: {LAS 1--: 3}

  - id: ARTHIST
    name: Art History
    rows:
      - scores: [3, 4, 5]
        credit: {ART 1--: 3}

  - id: ART2D
    name: 2-D Art and Design
    rows:
      - scores: [3, 4, 5]
        credit: {ART 105: 3}

  - id: ART3D
    name: 3-D Art and Design
    rows:
      - scores: [3, 4, 5]
        credit: {ART 104: 3}

  - id: DRAWING
    name: Drawing
    rows:
      - scores: [3, 4, 5]
        credit: {ART 102: 3}

  - id: BIO
    name: Biology
    rows:
      - scores: [3, 4]
        credit: {IB 100: 3}
      - scores: [5]
        credit: {IB 150: 4, MCB 150: 4}
        message: Talk with your advisor to determine which biology course you should enroll in, as it will depend on
          your major and your educational goals.

  - id: CALCAB
    name: Calculus AB
    rows:
      - scores: [3]
        college: other
        credit: {MATH 234: 4}
        message: Talk with your advisor. If your program requires MATH 220 or MATH 221, you will not receive credit
          towards graduation for MATH 234.
      - scores: [4, 5]
        college: other
        credit: {MATH 220: 5}
        message: Placed into MATH 231
      - scores: [3]
        college: grainger
        credit: {MATH 234: 4}
        message: MATH 234 does not satisfy the Calculus I requirement for Grainger Engineering majors. Discuss taking
          MATH 220 or MATH 221 during your advising appointment on your New Student Registration Day.
      - scores: [4]
        college: grainger
        credit: {MATH 220: 5}
        message: Discuss during your advising appointment on your New Student Registration Day. Grainger Engineering
          recommends taking MATH 221.
      - scores: [5]
        college: grainger
        credit: {MATH 220: 5}
        message: Placed into MATH 231 (Section EL1 or EL2) with concurrent enrollment in MATH 299.

  - id: CALCBC
    name: Calculus BC
    sub: Calculus AB subscore
    rows:
      - scores: [3]
        sub: [0, 1, 2, 3]
        college: other
        credit: {MATH 234: 4}
        message: Talk with your advisor. If your program requires MATH 220 or MATH 221, you will not receive credit
          towards graduation for MATH 234.
      - scores: [3]
        sub: [4, 5]
        college: other
        credit: {MATH 220: 5}
        message: Placed into MATH 231
      - scores: [4, 5]
        college: other
        credit: {MATH 220: 5, MATH 231: 3}
        message: Placed into MATH 241
      - scores: [3]
        sub: [0, 1, 2, 3]
        college: grainger
        credit: {MATH 234: 4}
        message: MATH 234 does not satisfy the Calculus I requirement for Grainger Engineering majors. Discuss taking
          MATH 220 or MATH 221 during your advising appointment on your New Student Registration Day.
      - scores: [3]
        sub: [4]
        college: grainger
        credit: {MATH 220: 5}
        message: Discuss during your advising appointment on your New Student Registration Day. Grainger Engineering
          recommends you take MATH 220 or MATH 221.
      - scores: [3]
        sub: [5]
        college: grainger
        credit: {MATH 220: 5}
        message: Placed into MATH 231 (Section EL1 or EL2) with concurrent enrollment in MATH 299.
      - scores: [4]
        college: grainger
        credit: {MATH 220: 5, MATH 231: 3}
        message: Discuss during your advising appointment on your New Student Registration Day. Grainger Engineering
          recommends taking MATH 231 (Section EL1 or EL2) with concurrent enrollment in MATH 299.
      - scores: [5]
        college: grainger
        credit: {MATH 220: 5, MATH 231: 3}
        message: Placed into MATH 241.

