        credit: {ANTH 230: 3}
        message: ANTH 270
      - level: SL
        scores: [4, 5]
        credit: {ANTH 1--: 3}
        message: ANTH 103
      - level: SL
        scores: [6, 7]
        credit: {ANTH 103: 3}
        message: ANTH 230

