# IB credit for students entering Illinois in Summer 2026, Fall 2026 or Spring 2027.
# Copied from CITL's cutoff score tool (year 2026-2027, exam type IB, every test selected) and checked row by row.
# Format and rules: docs/AP-CREDIT.md ("IB credit"). Placement messages are word for word; a `fix` says where we
# corrected the tool's row and quotes it. Subject names are ours (CITL writes them in capitals, with typos).
year: 2026-2027
entering: Summer 2026, Fall 2026 or Spring 2027
source: https://citl.illinois.edu/current-cutoff-scores
read_on: 2026-11-18
notes:
  - Only scores resulting in credit are shown. Illinois gives credit for IB scores of 4, 5, 6 and 7, whether Higher
    Level or Standard Level.
  - Course numbers listed as 1-- or 2-- are elective credit in that subject. Students can apply elective credit towards
    their graduation requirements; ask your academic advisor how it can best be used in your program.
  - If your IB results and a placement exam give different placement messages, you may follow the higher one. Discuss
    your options with your academic advisor.
  - Policies get reviewed every year and may change. To see IB credit in your academic record, run a new DARS report.
