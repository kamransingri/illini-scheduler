name: Student note
description: Tell other students what a course was like (exams, grading, workload). Shown on the course page once approved.
title: "Student note: "
labels: ["student-note"]
body:
  - type: markdown
    attributes:
      value: |
        Notes are about the course and how it's taught: exam format, the CBTF, curves, attendance, homework platform,
        projects, textbook. A maintainer reads every note before it goes on the site, word for word, with a link back
        to this issue. Your GitHub username isn't shown on the site.
  - type: input
    id: course
    attributes:
      label: Course
      description: Subject and number.
      placeholder: CS 124
    validations:
      required: true
  - type: input
    id: instructor
    attributes:
      label: Instructor
      description: As Course Explorer prints it, "Last, F". Leave empty if the note is about the course in general.
      placeholder: Challen, G
  - type: input
    id: term
    attributes:
      label: Term taken
      placeholder: Fall 2026
  - type: textarea
    id: note
    attributes:
      label: Note
      description: What should other students know? Up to 600 characters.
      placeholder: Weekly quizzes in the CBTF; no final.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Posting policy
      options:
        - label: This note is about the course and its teaching, not about anyone personally, and names no TAs.
          required: true
