# UI redesign preview: every push to feature/ui-redesign builds the site from that branch and deploys it to a separate
# Cloudflare Worker, so the redesign can be tried at its own address before anyone decides to merge it.
#   https://illini-scheduler-ui-redesign.kamransingri.workers.dev/
# The live site (main, GitHub Pages and the "illini-scheduler" Worker) is untouched. Free plan: static assets only, no
# Worker script, the same build as the live Cloudflare site (web/scripts/cloudflare-build.mjs), data read from GitHub
# Pages. Search engines are asked not to index it. Delete this file when the branch is merged or dropped.
name: UI redesign preview
on:
  push:
    branches: [feature/ui-redesign]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-redesign-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The last deploy's pipeline database
        id: db
        uses: actions/cache/restore@v6
        with:
          path: data/illini.db
          key: pipeline-db-none
          restore-keys: pipeline-db-
      - name: Stop without a database
        if: steps.db.outputs.cache-matched-key == ''
        run: |
          echo "::error::No pipeline database is cached yet (pages.yml saves one on each deploy), so the preview can't be built"
          exit 1
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install, and export this branch's data from the database
        run: |
          pip install -r requirements.txt
          (cd web && npm ci --prefer-offline)
          make export
      - name: Build for Cloudflare
        run: cd web && npm run cf:build
      - name: Keep the preview out of search results
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > web/out/_headers
      - name: Deploy the preview Worker
        run: cd web && npx wrangler deploy --name illini-scheduler-ui-redesign
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Link
        run: echo "::notice title=UI redesign preview::https://illini-scheduler-ui-redesign.kamransingri.workers.dev/"
