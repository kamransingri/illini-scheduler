name: CI
on:
  push:
    branches-ignore: [live-seats] # the live seat file's branch has no code
  pull_request:

# A newer push to the same branch replaces a run that's still going
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # /no-checks-pr (commands.yml): on a pull request labelled no-checks-pr, test and e2e are skipped, and a job skipped
  # by its `if` counts as passed for the required checks. The label only counts if the command added it (as
  # github-actions[bot]) or someone in .github/pr-command-users.txt did, read from main; anyone else's label is ignored.
  # It's read live, so a re-run after adding it skips them. This job never fails, and if it does anyway the tests run.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      skip: ${{ steps.label.outputs.skip }}
    steps:
      - id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          repo=$GITHUB_REPOSITORY
          if [ -z "$PR" ] && [ "$BRANCH" != "$MAIN" ]; then
            PR=$(gh pr list -R "$repo" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          fi
          [ -n "$PR" ] || exit 0
          gh api "repos/$repo/issues/$PR/labels" --jq '.[].name' 2>/dev/null | grep -qx no-checks-pr || exit 0
          by=$(gh api --paginate "repos/$repo/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "no-checks-pr") | .actor.login' 2>/dev/null | tail -n 1 || true)
          users=$(gh api "repos/$repo/contents/.github/pr-command-users.txt?ref=$MAIN" -H "Accept: application/vnd.github.raw" 2>/dev/null \
            | sed 's/#.*//' | tr -d ' \r' | grep . || true)
          if [ "$by" = "github-actions[bot]" ] || { [ -n "$by" ] && grep -qixF -- "$by" <<<"$users"; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Labelled no-checks-pr by $by (/no-checks-pr): test and e2e are skipped"
          else
            echo "::warning::The no-checks-pr label was added by ${by:-someone unknown}, who isn't in .github/pr-command-users.txt, so the checks run"
          fi

  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - run: pip install -r requirements.txt
      - run: cd web && npm ci --prefer-offline
      - run: cd mcp && npm ci --prefer-offline
      - name: Lint + typecheck
        run: make lint
      - name: Unit tests
        run: make test
        env:
          PYTEST_ARGS: -n auto # pytest-xdist on the runner's 4 cores (#148)
      - name: MCP package installs, starts with npx and answers every tool
        run: cd mcp && npm run smoke --silent

  # Browser tests on pull requests (#148): this branch's export and site, built on the pipeline database of the last
  # deploy (pages.yml caches it), so no fetching. Skipped for changes that can't affect a page; pages.yml runs the
  # whole suite again after merge.
  e2e:
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Does this change a page?
        id: pages
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # A base that's gone (its branch deleted after a merge) can't be compared: run the tests rather than skip them.
          if ! files=$(git diff --name-only "$BASE"...HEAD); then
            echo "::warning::Couldn't compare with $BASE, so the browser tests run"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(web/|mcp/|pipeline/|data/|\.github/workflows/ci\.yml)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change under web/, mcp/, pipeline/ or data/: no browser tests needed"
          fi
      - name: The last deploy's pipeline database
        id: db
        if: steps.pages.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/illini.db
          key: pipeline-db-none
          restore-keys: pipeline-db-
      - name: No database cached yet
        if: steps.pages.outputs.run == 'true' && steps.db.outputs.cache-matched-key == ''
        run: echo "::notice::No pipeline database from a deploy is cached yet (pages.yml saves one), so the browser tests are skipped"
      - uses: actions/setup-python@v7
        if: steps.db.outputs.cache-matched-key != ''
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        if: steps.db.outputs.cache-matched-key != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - name: Install, and export this branch's data from the database
        if: steps.db.outputs.cache-matched-key != ''
        run: |
          pip install -r requirements.txt
          (cd web && npm ci --prefer-offline)
          (cd mcp && npm ci --prefer-offline && npm run build --silent) # mcp-link.spec.ts runs the built server
          make export
      - name: Next.js build cache
        if: steps.db.outputs.cache-matched-key != ''
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('web/package-lock.json') }}-
      - name: Build the site
        if: steps.db.outputs.cache-matched-key != ''
        run: make build
      - name: Playwright's version
        id: pw
        if: steps.db.outputs.cache-matched-key != ''
        run: echo "v=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright's browser (cached)
        if: steps.db.outputs.cache-matched-key != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # The runner image already has Chrome's system libraries; apt only runs if Chromium can't start without it (#148)
      - name: Install Chromium (and its system libraries if missing)
        if: steps.db.outputs.cache-matched-key != ''
        run: cd web && npx playwright install chromium && (node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium)
      - name: Browser tests against the build
        if: steps.db.outputs.cache-matched-key != ''
        run: cd web && npx playwright test

  # Versions and branches (CONTRIBUTING.md). Only the standard library, so no installs.
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # tags and the base branch, to compare with
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Version files agree, CHANGELOG covers the version, and it only goes up
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python -m tools.release check ${BASE:+--base "$BASE"}
      - name: Branch name is type/short-name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|chore|data|hotfix|release|dependabot)/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Branch '$BRANCH' should be named type/short-name, with type one of feature, fix, docs, chore, data, hotfix, release (CONTRIBUTING.md). Rename it with: git branch -m feature/$BRANCH && git push -u origin feature/$BRANCH"
            exit 1
          fi
