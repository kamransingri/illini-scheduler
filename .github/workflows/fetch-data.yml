# Refreshes the real Course Explorer and RMP responses the tests use (fixtures/README.md), from GitHub's runners.
# After a refresh, update the date in fixtures/README.md.
name: Fetch data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Fetch Course Explorer XML + RMP answers for the tests
        run: python -m pipeline.fetch_fixtures
      - name: Commit fixtures
        run: |
          git config user.name "illini-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f fixtures/
          git diff --cached --quiet || git commit -m "data: refresh fixtures from live sources"
          git push
