# Weekly check that Course Explorer hasn't published a term after NEXT_TERM (pipeline/term_watch.py, issue #33). The
# current and next term are set by hand in pipeline/fetch.py; when a newer term is published, this opens one issue with
# the rollover checklist. It never changes the terms itself.
name: New term check
on:
  schedule:
    - cron: "23 15 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Look for a published term after NEXT_TERM
        id: check
        run: |
          set +e
          python -m pipeline.term_watch --issue issue.md --title title.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 10 ] # 10 = a newer term; anything else is an error and fails the job
      - name: Open an issue (unless one for this term is already open)
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(cat title.txt)
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$open" != "0" ]; then echo "An open issue already covers this."; exit 0; fi
          gh issue create --title "$TITLE" --label maintenance --label data-pipeline --body-file issue.md
