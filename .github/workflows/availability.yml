# Slow, resumable seat-availability crawl (Open / Closed / Restricted per section) from the public Course Explorer
# pages. ~1 request per second, oldest-checked courses first; results are force-pushed to the one-commit `availability`
# branch (tools/availability-files.sh, #180) and picked up by the nightly site build. Seat counts are only in Self-Service (NetID) and are never scraped.
name: Seat availability
on:
  schedule:
    - cron: "17 4 * * *" # daily, before the 09:00 UTC site build
  workflow_dispatch:
    inputs:
      minutes:
        description: "Crawl time budget in minutes"
        default: "270"

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Previous files from the availability branch (the crawl resumes from them)
        run: tools/availability-files.sh fetch
      - name: Crawl (next term first)
        run: python -m pipeline.availability --minutes "${{ inputs.minutes || '270' }}"
      - name: Publish (one commit, force-pushed, so the branch never grows)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/availability-files.sh publish
