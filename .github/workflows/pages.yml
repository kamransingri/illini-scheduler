# Deploys the site. The nightly run refreshes every data source (about 20 minutes); a code push reuses the database the
# last refresh cached and only re-exports it, so it deploys in a few minutes. To refresh on a push or merge anyway, put
# [refresh data] in the commit message or the pull request's title, or tick "Refresh data" when running it by hand.
name: Refresh data and deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**"]
  schedule:
    - cron: "0 9 * * *" # nightly, 09:00 UTC
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh data (about 20 minutes) instead of reusing the last refresh's database
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      cloudflare: ${{ steps.cf.outputs.on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - run: pip install -r requirements.txt
      - run: cd web && npm ci --prefer-offline
      - run: cd mcp && npm ci --prefer-offline
      - name: The last refresh's database (code pushes reuse it)
        id: db
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_data)
        uses: actions/cache/restore@v6
        with:
          path: data/illini.db
          key: pipeline-db-none
          restore-keys: pipeline-db-
      - name: Refresh data or reuse it?
        id: mode
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          CACHED: ${{ steps.db.outputs.cache-matched-key }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.refresh_data }}" = true ]; then refresh=true
          elif printf '%s' "$MESSAGE" | grep -qiF '[refresh data]'; then refresh=true
          elif [ -z "$CACHED" ]; then refresh=true; echo "::notice::No cached database, so this run refreshes data"
          else refresh=false; echo "::notice::Reusing the database from the last refresh ($CACHED); add [refresh data] to the commit message to refresh"
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - name: Export this commit's data from the cached database
        if: steps.mode.outputs.refresh == 'false'
        run: make export
      - name: Restore RMP cache (7-day responses)
        if: steps.mode.outputs.refresh == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/raw/rmp
          key: rmp-${{ github.run_id }}
          restore-keys: rmp-
      - name: Restore OpenStreetMap and MTD caches (building locations #93, bus timetable #96; refreshed weekly)
        if: steps.mode.outputs.refresh == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw/osm
            data/raw/mtd
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Seat availability files from the availability branch
        if: steps.mode.outputs.refresh == 'true'
        run: tools/availability-files.sh fetch
      - name: Refresh data (Wade's datasets + Course Explorer mirror, seat availability files, RMP)
        # SOURCE=csv: the live Course Explorer feed answers bursts from GitHub with HTTP 202 (DECISIONS.md D11.3);
        # seat status comes from data/availability/*.json, kept fresh by availability.yml on the availability branch.
        if: steps.mode.outputs.refresh == 'true'
        run: make data SOURCE=csv
        env:
          AVAILABILITY_MODE: file
          RMP_BUDGET_SECONDS: "1200" # new RMP lookups per run; the 7-day cache carries the rest forward
      - name: Save RMP cache (even if later steps fail)
        if: always() && steps.mode.outputs.refresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw/rmp
          key: rmp-${{ github.run_id }}
      - name: Save OpenStreetMap and MTD caches (even if later steps fail)
        if: always() && steps.mode.outputs.refresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw/osm
            data/raw/mtd
          key: osm-${{ github.run_id }}
      - name: Save the pipeline database for pull requests' browser tests (ci.yml e2e, #148) and code pushes
        if: github.ref == 'refs/heads/main' && steps.mode.outputs.refresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/illini.db
          key: pipeline-db-${{ github.run_id }}
      - name: Lint + type check + unit tests
        run: make lint && make test
        env:
          PYTEST_ARGS: -n auto
      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-pages-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-pages-${{ hashFiles('web/package-lock.json') }}-
      - name: Build static site
        run: make build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Playwright's version
        id: pw
        run: echo "v=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright's browser (cached)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # The runner image already has Chrome's system libraries; apt only runs if Chromium can't start without it (#148)
      - name: Install Chromium (and its system libraries if missing)
        run: cd web && npx playwright install chromium && (node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium)
      - name: End-to-end tests against the build
        run: |
          cd web
          mkdir -p ../site/${{ github.event.repository.name }}
          cp -r out/. ../site/${{ github.event.repository.name }}/
          cp out/404.html ../site/404.html  # GitHub Pages serves the project's 404.html for unknown paths
          (npx serve ../site -l 4173 --no-clipboard &) && sleep 3
          E2E_BASE_URL=http://127.0.0.1:4173/${{ github.event.repository.name }}/ npx playwright test
      - name: Lighthouse on a course page (median of 3 runs; performance >= 0.80, accessibility >= 0.90; refresh runs only)
        if: steps.mode.outputs.refresh == 'true'
        run: |
          curl -s -o /dev/null http://127.0.0.1:4173/ || ((cd web && npx serve ../site -l 4173 --no-clipboard &) && sleep 3)
          for i in 1 2 3; do
            npx -y lighthouse@12.8.2 "http://127.0.0.1:4173/${{ github.event.repository.name }}/course/CS/124/" \
              --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices \
              --output=json --output-path=lh-$i.json --quiet
          done
          python3 - <<'PY'
          import json, statistics, sys
          runs = [{k: v["score"] for k, v in json.load(open(f"lh-{i}.json"))["categories"].items()} for i in (1, 2, 3)]
          med = {k: statistics.median(r[k] for r in runs) for k in runs[0]}
          print("Lighthouse runs:", runs)
          print("Lighthouse median:", med)
          sys.exit(0 if med["performance"] >= 0.80 and med["accessibility"] >= 0.90 else 1)
          PY
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/out }
      # Cloudflare (docs/CLOUDFLARE.md): the same site at the root without data/, which it reads from GitHub Pages.
      # Off until the CLOUDFLARE_API_TOKEN secret is set.
      - name: Cloudflare deploy on?
        id: cf
        run: echo "on=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Build for Cloudflare
        if: steps.cf.outputs.on == 'true'
        run: cd web && npm run cf:build
      - if: steps.cf.outputs.on == 'true'
        uses: actions/upload-artifact@v5
        with: { name: cloudflare-site, path: web/out, retention-days: 3 }
      # Last: its `git pull` brings newer commits into this checkout, which nothing after it may build from.
      - name: Commit refreshed data summaries (only after tests pass; never blocks the deploy)
        if: steps.mode.outputs.refresh == 'true'
        continue-on-error: true
        run: |
          mkdir -p data/snapshot
          cp web/public/data/meta.json data/snapshot/meta.json
          git config user.name "illini-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/unmatched.csv data/snapshot/meta.json
          git diff --cached --quiet && exit 0
          git commit -m "data: nightly refresh $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  cloudflare:
    # After GitHub Pages, so the data the Cloudflare pages fetch is already live
    needs: [build, deploy]
    if: needs.build.outputs.cloudflare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with: { name: cloudflare-site, path: web/out }
      - name: Deploy to Cloudflare
        run: cd web && npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    # Load the live site after every deploy and run the core browser tests against it.
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --prefer-offline
      - name: Playwright's version
        id: pw
        run: echo "v=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright's browser (cached)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: cd web && npx playwright install chromium && (node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" || npx playwright install-deps chromium)
      - name: Wait for the live site
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${url}course/CS/124/") && [ "$code" = "200" ] && exit 0
            echo "attempt $i: HTTP $code"; sleep 10
          done
          exit 1
      - name: Smoke tests against the live URL
        run: cd web && E2E_BASE_URL="${{ needs.deploy.outputs.page_url }}" npx playwright test course.spec.ts geneds.spec.ts
