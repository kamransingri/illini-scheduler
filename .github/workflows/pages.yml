name: Refresh data and deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**"]
  schedule:
    - cron: "0 9 * * *" # nightly, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -r requirements.txt
      - run: cd web && npm ci
      - name: Restore RMP cache (7-day responses)
        uses: actions/cache/restore@v6
        with:
          path: data/raw/rmp
          key: rmp-${{ github.run_id }}
          restore-keys: rmp-
      - name: Refresh data (Wade's datasets + Course Explorer mirror, seat availability files, RMP)
        # SOURCE=csv: the live Course Explorer feed answers bursts from GitHub with HTTP 202 (DECISIONS.md D11.3);
        # seat status comes from data/availability/*.json, kept fresh by availability.yml.
        run: make data SOURCE=csv
        env:
          AVAILABILITY_MODE: file
          RMP_BUDGET_SECONDS: "1200" # new RMP lookups per run; the 7-day cache carries the rest forward
      - name: Save RMP cache (even if later steps fail)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/raw/rmp
          key: rmp-${{ github.run_id }}
      - name: Lint + type check + unit tests
        run: make lint && make test
      - name: Build static site
        run: make build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: End-to-end tests against the build
        run: |
          cd web
          npx playwright install --with-deps chromium
          mkdir -p ../site/${{ github.event.repository.name }}
          cp -r out/. ../site/${{ github.event.repository.name }}/
          cp out/404.html ../site/404.html  # GitHub Pages serves the project's 404.html for unknown paths
          (npx serve ../site -l 4173 --no-clipboard &) && sleep 3
          E2E_BASE_URL=http://127.0.0.1:4173/${{ github.event.repository.name }}/ npx playwright test
      - name: Lighthouse on a course page (median of 3 runs; performance >= 0.80, accessibility >= 0.90)
        run: |
          curl -s -o /dev/null http://127.0.0.1:4173/ || ((cd web && npx serve ../site -l 4173 --no-clipboard &) && sleep 3)
          for i in 1 2 3; do
            npx -y lighthouse@12.8.2 "http://127.0.0.1:4173/${{ github.event.repository.name }}/course/CS/124/" \
              --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices \
              --output=json --output-path=lh-$i.json --quiet
          done
          python3 - <<'PY'
          import json, statistics, sys
          runs = [{k: v["score"] for k, v in json.load(open(f"lh-{i}.json"))["categories"].items()} for i in (1, 2, 3)]
          med = {k: statistics.median(r[k] for r in runs) for k in runs[0]}
          print("Lighthouse runs:", runs)
          print("Lighthouse median:", med)
          sys.exit(0 if med["performance"] >= 0.80 and med["accessibility"] >= 0.90 else 1)
          PY
      - name: Commit refreshed data summaries (only after tests pass; never blocks the deploy)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p data/snapshot
          cp web/public/data/meta.json data/snapshot/meta.json
          git config user.name "illini-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/unmatched.csv data/snapshot/meta.json
          git diff --cached --quiet && exit 0
          git commit -m "data: nightly refresh $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/out }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    # Load the live site after every deploy and run the core browser tests against it.
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - name: Wait for the live site
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${url}course/CS/124/") && [ "$code" = "200" ] && exit 0
            echo "attempt $i: HTTP $code"; sleep 10
          done
          exit 1
      - name: Smoke tests against the live URL
        run: cd web && E2E_BASE_URL="${{ needs.deploy.outputs.page_url }}" npx playwright test course.spec.ts geneds.spec.ts
