# Turns open "Student note" issues that a maintainer labelled `approved` into data/notes/*.yaml and opens a pull
# request that closes them (pipeline/notes_intake.py, issue #31). Run it from the Actions tab.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests". A pull request
# opened by this workflow doesn't start CI by itself: close and reopen it to run the checks.
name: Student notes intake
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Approved issues to YAML
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.notes_intake --pr-body pr.md
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/notes
          if git diff --cached --quiet; then echo "No new approved notes."; exit 0; fi
          branch="data/student-notes-${{ github.run_number }}"
          git config user.name "illini-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "data: student notes from approved issues"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Student notes from approved issues" --body-file pr.md
